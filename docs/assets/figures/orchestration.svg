<svg xmlns="http://www.w3.org/2000/svg" width="520" height="474" viewBox="0 0 520 474" role="img" aria-labelledby="title desc">
  <title id="title">MemPilot: a learned policy, an adaptive memory loop</title>
  <desc id="desc">The orchestrator reads the query and evidence collected so far. It chooses retrieval from a memory bank or delegates curation of raw history to a selected LLM or VLM. It sets the retrieval query, evidence count, curation instruction, model, and visual access. Text observations return to the current state for the next decision. The policy can also finish and answer.</desc>
  <defs>
    <marker id="arrow-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#718b85" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#668aa6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#368b70" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- Both tools return textual observations to the policy's next state. -->
    <path d="M486 171h9q13 0 13-13V30q0-13-13-13H298q-14 0-14 14v32q0 12-12 12" fill="none" stroke="#8fa89e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"/>
    <rect x="317" y="6" width="150" height="22" rx="5" fill="#fff"/>
    <text x="392" y="21" text-anchor="middle" font-size="11" fill="#648072">Text evidence → next step</text>

    <rect x="24" y="44" width="248" height="62" rx="10" fill="#f5f8f5" stroke="#d4e0d7"/>
    <text x="42" y="64" font-size="9" letter-spacing="1.2" fill="#6d8178">CURRENT STATE</text>
    <text x="42" y="87" font-size="13" font-weight="500" fill="#284a3c">Query + evidence collected so far</text>
    <path d="M148 106v28" fill="none" stroke="#8fa89e" stroke-width="1.5" marker-end="url(#arrow-ink)"/>

    <!-- Policy decisions are the focus; the two tools are delegated operations. -->
    <rect x="24" y="138" width="248" height="220" rx="13" fill="#172f3d"/>
    <text x="44" y="173" font-size="26" font-weight="600" letter-spacing="-.8" fill="#fff">MemPilot</text>
    <text x="250" y="173" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="27" fill="#a8dfc9">π<tspan font-size="15" dy="5">θ</tspan></text>
    <text x="44" y="195" font-size="9.5" letter-spacing="1.05" fill="#b4d5c7">ORCHESTRATOR POLICY</text>
    <path d="M44 211h208" stroke="#39545c"/>
    <circle cx="49" cy="233" r="3" fill="#a8dfc9"/>
    <text x="61" y="237" font-size="12" fill="#f2f7f5">Choose RETRIEVE or CURATE</text>
    <circle cx="49" cy="258" r="3" fill="#a8dfc9"/>
    <text x="61" y="262" font-size="12" fill="#f2f7f5">Set query &amp; evidence count</text>
    <text x="44" y="290" font-size="10.5" fill="#abc3b9">For CURATE, also choose</text>
    <g font-size="10" text-anchor="middle" fill="#dceee5">
      <rect x="44" y="302" width="76" height="25" rx="5" fill="#294951" stroke="#426159"/>
      <text x="82" y="318">Instruction</text>
      <rect x="126" y="302" width="58" height="25" rx="5" fill="#294951" stroke="#426159"/>
      <text x="155" y="318">Model</text>
      <rect x="190" y="302" width="62" height="25" rx="5" fill="#294951" stroke="#426159"/>
      <text x="221" y="318">Visuals</text>
    </g>
    <text x="44" y="346" font-size="9" fill="#94b1a8">Text-only policy · learned with RL</text>

    <path d="M272 171h50" fill="none" stroke="#668aa6" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
    <rect x="326" y="130" width="160" height="84" rx="10" fill="#eff5f8" stroke="#d3e0e8"/>
    <text x="342" y="151" font-size="10" letter-spacing=".6" font-weight="600" fill="#507691">RETRIEVE</text>
    <text x="342" y="177" font-size="15" font-weight="600" fill="#244557">Memory bank</text>
    <text x="342" y="197" font-size="10.5" fill="#6e828c">Query-agnostic memory</text>

    <path d="M272 272h50" fill="none" stroke="#368b70" stroke-width="1.7" marker-end="url(#arrow-green)"/>
    <rect x="326" y="239" width="160" height="119" rx="10" fill="#edf6ef" stroke="#cddfd2"/>
    <text x="342" y="261" font-size="10" letter-spacing=".6" font-weight="600" fill="#32795c">CURATE</text>
    <text x="342" y="285" font-size="14" font-weight="600" fill="#2f5140">Raw text + images</text>
    <path d="M405 293v12" stroke="#79a58b" marker-end="url(#arrow-green)"/>
    <rect x="338" y="309" width="136" height="34" rx="6" fill="#dcecdf" stroke="#c5dccb"/>
    <text x="406" y="330" text-anchor="middle" font-size="11" font-weight="500" fill="#326046">Selected LLM / VLM</text>
    <path d="M474 326h21q13 0 13-13V145" fill="none" stroke="#8fa89e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-ink)"/>

    <path d="M148 358v52" fill="none" stroke="#718b85" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
    <text x="163" y="388" font-size="10" fill="#698076">Decide to finish</text>
    <rect x="24" y="416" width="248" height="48" rx="9" fill="#f2f6ef" stroke="#d3dfca"/>
    <circle cx="46" cy="440" r="4" fill="#598765"/>
    <text x="60" y="445" font-size="14" font-weight="600" fill="#30573c">Final answer</text>
    <path d="M232 440h15m-5-5 5 5-5 5" fill="none" stroke="#6e9178" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="326" y="421" font-size="11" fill="#5e7569">Gather evidence.</text>
    <text x="326" y="440" font-size="11" fill="#5e7569">Update the state.</text>
    <text x="326" y="459" font-size="11" font-weight="600" fill="#32795c">Let the policy decide again.</text>
  </g>
</svg>
